<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>StickPilot remote</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="tray-page">
  <header class="tray-head">
    <div class="tray-title"><img src="logo.png" width="22" height="22" alt=""><span id="t-name">StickPilot</span><span id="t-status" class="pill"></span></div>
    <button id="t-open" class="icon-btn" title="Open the StickPilot window"></button>
  </header>
  <div id="t-remote" class="tray-remote"></div>
  <div id="t-idle" class="tray-idle" hidden>
    <p id="t-idle-text">Not connected.</p>
    <button id="t-connect" class="primary">Connect remote</button>
  </div>
  <footer class="tray-foot">
    <button id="t-disconnect" class="ghost">Disconnect</button>
  </footer>
  <script src="tray.js"></script>
</body>
</html>
